<title>Welcome</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: Arial, Helvetica, sans-serif;
    }

    .page {
        position: relative;
        width: 100%;
        height: 100vh;
        background:
            radial-gradient(circle at center, #171717 0%, #050505 45%, #000 100%);
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* Ambient glow */
    .glow {
        position: absolute;
        width: 600px;
        height: 600px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.05);
        filter: blur(100px);
        animation: pulse 5s ease-in-out infinite;
        pointer-events: none;
    }

    @keyframes pulse {
        0%, 100% {
            transform: scale(.8);
            opacity: .35;
        }

        50% {
            transform: scale(1.15);
            opacity: .7;
        }
    }

    .video-container {
        position: relative;
        width: min(100vw, 1200px);
        aspect-ratio: 16 / 9;
        border-radius: 24px;
        overflow: hidden;
        background: #000;
        box-shadow:
            0 0 80px rgba(255,255,255,.08),
            0 30px 100px rgba(0,0,0,.8);
        z-index: 2;
    }

    #player {
        width: 100%;
        height: 100%;
    }

    iframe {
        width: 100%;
        height: 100%;
        border: none;
    }

    /* Sound button */
    .sound-button {
        position: fixed;
        left: 50%;
        bottom: 35px;
        transform: translateX(-50%);

        border: 1px solid rgba(255,255,255,.2);
        background: rgba(20,20,20,.75);
        backdrop-filter: blur(15px);

        color: #fff;
        padding: 14px 24px;
        border-radius: 50px;

        font-size: 15px;
        font-weight: 600;

        cursor: pointer;
        z-index: 20;

        box-shadow: 0 10px 40px rgba(0,0,0,.5);

        transition: .25s ease;
    }

    .sound-button:hover {
        transform: translateX(-50%) scale(1.05);
        background: rgba(255,255,255,.12);
    }

    .sound-button.hidden {
        opacity: 0;
        pointer-events: none;
        transform: translateX(-50%) translateY(15px);
    }

    /* Loading */
    .loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 15px;

        background: #000;
        color: #fff;

        z-index: 10;

        transition: opacity .7s ease;
    }

    .loading.hide {
        opacity: 0;
        pointer-events: none;
    }

    .loader {
        width: 42px;
        height: 42px;

        border: 3px solid rgba(255,255,255,.15);
        border-top-color: #fff;

        border-radius: 50%;
        animation: spin 1s linear infinite;
    }

    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }

    .loading-text {
        font-size: 13px;
        letter-spacing: 2px;
        opacity: .65;
        text-transform: uppercase;
    }

    /* Mobile */
    @media (max-width: 700px) {

        .video-container {
            width: 100vw;
            border-radius: 0;
            aspect-ratio: 16 / 9;
        }

        .sound-button {
            bottom: 25px;
            font-size: 14px;
            padding: 13px 21px;
        }
    }
</style>

<div class="page">

    <div class="glow"></div>

    <div class="video-container">
        <div id="player"></div>
    </div>

</div>

<!-- Loading screen -->
<div class="loading" id="loading">
    <div class="loader"></div>
    <div class="loading-text">Loading</div>
</div>

<!-- Sound button -->
<button class="sound-button" id="soundButton">
    🔊 Enable Sound
</button>


<script>
    let player;

    const VIDEO_ID = "jZOy8gbkYMQ";

    const soundButton = document.getElementById("soundButton");
    const loading = document.getElementById("loading");


    /*
     * Load YouTube IFrame API
     */
    const tag = document.createElement("script");

    tag.src = "https://www.youtube.com/iframe_api";

    const firstScriptTag =
        document.getElementsByTagName("script")[0];

    firstScriptTag.parentNode.insertBefore(
        tag,
        firstScriptTag
    );


    /*
     * YouTube API ready
     */
    function onYouTubeIframeAPIReady() {

        player = new YT.Player("player", {

            videoId: VIDEO_ID,

            playerVars: {
                autoplay: 1,
                controls: 1,
                playsinline: 1,
                rel: 0,
                enablejsapi: 1
            },

            events: {

                onReady: function(event) {

                    /*
                     * Try autoplay with full volume
                     */
                    event.target.setVolume(100);

                    event.target.unMute();

                    event.target.playVideo();

                    setTimeout(() => {

                        event.target.setVolume(100);
                        event.target.unMute();

                    }, 500);

                    loading.classList.add("hide");
                },

                onStateChange: function(event) {

                    /*
                     * Keep volume at 100
                     */
                    if (
                        event.data === YT.PlayerState.PLAYING
                    ) {
                        player.setVolume(100);
                        player.unMute();

                        soundButton.classList.add("hidden");
                    }
                },

                /*
                 * Browser blocked autoplay
                 */
                onAutoplayBlocked: function() {

                    soundButton.classList.remove("hidden");
                    loading.classList.add("hide");
                }

            }

        });
    }


    /*
     * User clicks Enable Sound
     */
    soundButton.addEventListener("click", function() {

        if (!player) return;

        player.unMute();
        player.setVolume(100);
        player.playVideo();

        soundButton.classList.add("hidden");

    });
</script>
